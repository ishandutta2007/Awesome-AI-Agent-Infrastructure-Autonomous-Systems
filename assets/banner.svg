<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Cyan to Violet Gradient -->
    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.6; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes pulseRing {
      0% { r: 10px; opacity: 0.8; }
      100% { r: 35px; opacity: 0; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
    .card-float-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-float-2 { animation: floatCard2 7s ease-in-out infinite; }
    .radar-pulse { animation: pulseRing 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in the Background -->
  <circle class="orb-1" cx="220" cy="120" r="140" fill="#6366f1" filter="url(#glow)" />
  <circle class="orb-2" cx="980" cy="280" r="160" fill="#ec4899" filter="url(#glow)" />
  <circle cx="600" cy="380" r="120" fill="#06b6d4" opacity="0.25" filter="url(#glow)" />

  <!-- Animated Background Network Flow Lines (Subtle) -->
  <g stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.3">
    <path d="M 150 350 Q 300 280 600 320 T 1050 250" fill="none" />
    <path d="M 180 100 Q 450 60 750 140 T 1100 120" fill="none" />
  </g>

  <!-- Interactive Decorative Floating Badges/Cards at Bottom -->
  <g class="card-float-1" transform="translate(140, 290)">
    <rect width="260" height="58" rx="29" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="32" cy="29" r="14" fill="#6366f1" fill-opacity="0.3" />
    <circle cx="32" cy="29" r="7" fill="#818cf8" />
    <circle class="radar-pulse" cx="32" cy="29" r="10" stroke="#818cf8" fill="none" stroke-width="1.5" />
    <text x="60" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Autonomous Workforces</text>
    <text x="60" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11">Multi-Agent State Systems</text>
  </g>

  <g class="card-float-2" transform="translate(470, 290)">
    <rect width="260" height="58" rx="29" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="32" cy="29" r="14" fill="#8b5cf6" fill-opacity="0.3" />
    <circle cx="32" cy="29" r="7" fill="#a78bfa" />
    <circle class="radar-pulse" cx="32" cy="29" r="10" stroke="#a78bfa" fill="none" stroke-width="1.5" />
    <text x="60" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">MicroVM Sandboxes</text>
    <text x="60" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11">Firecracker &amp; MCP Gateways</text>
  </g>

  <g class="card-float-1" transform="translate(800, 290)">
    <rect width="260" height="58" rx="29" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="32" cy="29" r="14" fill="#ec4899" fill-opacity="0.3" />
    <circle cx="32" cy="29" r="7" fill="#f472b6" />
    <circle class="radar-pulse" cx="32" cy="29" r="10" stroke="#f472b6" fill="none" stroke-width="1.5" />
    <text x="60" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Persistent Memory &amp; Evals</text>
    <text x="60" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11">OpenTelemetry &amp; Knowledge Graphs</text>
  </g>

  <!-- Top Category Pill Tag -->
  <g transform="translate(450, 48)">
    <rect width="300" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="url(#accentGrad)" stroke-width="1.5" />
    <text x="150" y="22" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">⚡ THE AUTONOMOUS SYSTEMS ECOSYSTEM</text>
  </g>

  <!-- Foreground Main Title & Subtitle (High Contrast, Never Obscured) -->
  <text x="600" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="url(#accentGrad)" letter-spacing="-0.5">
    AI Agent Infrastructure
  </text>
  
  <text x="600" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="-0.5">
    &amp; Autonomous Systems
  </text>

  <text x="600" y="246" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#cbd5e1" letter-spacing="0.3">
    Curated Hub of Multi-Agent Workforces • Sandboxed Runtimes • Memory Kernels • AI Gateways
  </text>
</svg>